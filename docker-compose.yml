version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: little-stars-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=stars_academy_prod_jwt_secret_key_2026
      - FRONTEND_URL=http://localhost
    volumes:
      # Persistent storage for SQLite database and uploaded recordings
      - backend-data:/app/uploads
      - backend-db:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: little-stars-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
  backend-db:
